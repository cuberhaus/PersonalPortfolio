  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("assets/fonts/captured-UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("assets/fonts/captured-tDbv2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKwBNntkaToggR7BYRbKPxDcwgknk-4.woff2") format("woff2");

    #root {
      width: 1080px;

      position: relative;
      overflow: hidden;

    .t01-ground { position: absolute; inset: 0; background: #17231f; }

    /* Window: everything below the 80px strip + 1px hairline (81px), 999px tall. The page scrolls inside it. */
    .t01-window { position: absolute; left: 0; top: 81px; width: 1080px; height: 999px; overflow: hidden; }
    .t01-page { position: absolute; left: 0; top: 0; width: 1080px; height: 8584px; will-change: transform; }
    .t01-seg { position: absolute; left: 0; width: 1080px; background-size: 100% 100%; background-repeat: no-repeat; }

    .t01-strip { position: absolute; left: 0; top: 0; width: 1080px; height: 81px; background: #17231f; }
    .t01-slot {
      position: absolute;

    .t01-slot-d { left: 59px; }

    .t01-slot-p .t01-tok { right: 0; color: rgba(194, 213, 210, 0.78); }
    .t01-slot-d .t01-tok { left: 0; }
    .t01-tok { position: absolute; top: 0; opacity: 0; }
    /* No !important: GSAP's inline opacity must be able to hide the first tokens at the first swap. */
    .t01-slot-d .t01-tok.t01-tok-first,
    .t01-slot-p .t01-tok.t01-tok-first { opacity: 1; }

    .t01-hair { position: absolute; left: 59px; top: 80px; width: 962px; height: 1px; background: rgba(194, 213, 210, 0.45); }
    .t01-ticks { position: absolute; left: 59px; top: 56px; width: 962px; height: 24px; }
    .t01-tick {

    /* Plates sit on the left, above the 896px caption keep-out. Flat ink, cream display type, no shadow.
       Each plate's top and height come from scripts/pick-stops.mjs: they sit on empty rows of the page
       at their stop where there are any, otherwise their edges are on clean rows so no line of the site's
       text is sliced. The text is centred in the plate (a little high: lowercase has no cap-height). */
    .t01-plate {
      position: absolute;
      left: 59px;

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "01-one-scroll";

      // [heading as the site writes it, where the window parks to read it (page y of the window's top edge),
      // the heading's own page y]. Generated by scripts/pick-stops.mjs from the capture (capture/sections.json
      // and layout.json): each stop's top and bottom edges sit on empty rows of the page (or, where a section is
      // too tall for that, cross only a card's padding), the section's own header is fully in view, and the
      // window never ends inside the next section's header. The hero parks 150 px down, cropping the hidden nav
      // row and the empty top padding.
      var STOPS = [
        ["Pol Casacuberta", 150, 306],
        ["Featured Projects", 892, 1012],
        ["Try my projects", 1631, 1732],
        ["A bit about me", 3241, 3349],
        ["Where I've worked", 4236, 4390],
        ["Tech I work with", 5061, 5276],
        ["Licenses & certifications", 6004, 6112],
        ["Where I studied", 7004, 7088],
        ["Get in touch", 7442, 7550],
      ];
      var N = STOPS.length;

      // ---- The music bed's beat grid (measured on the bed: 135.1 BPM; see STORYBOARD "Music only").
      // The bed starts 6.2s into the source track, so its first beat falls 0.046s in and the drop (full energy)
      // lands at 1.8s = beat 4, which is when the first scroll leg starts.
      var BEAT = 60 / 135.1;
      var BEAT0 = 0.046;
      var FPS = 30;
      function at(beats) {
        return Math.round((BEAT0 + beats * BEAT) * FPS) / FPS;
      }

      // Leg lengths in beats: each is half a flat share and half proportional to the distance it has to cover,
      // so long sections get time to be read and the short education hop does not crawl. They add up to 54.5.
      var LEG_BEATS = [6.5, 6, 9.5, 7, 6.5, 7, 7, 5];
      var HERO_HOLD_BEATS = 4;

      var slotD = document.getElementById("t01-tok-d");
      var slotP = document.getElementById("t01-tok-p");
      var ticks = document.getElementById("t01-ticks");

      // ---- Build the label tokens and ticks from the table (deterministic; no randomness).
      STOPS.forEach(function (stop, k) {
        var td = document.createElement("span");
        td.id = "t01-td-" + k;
        td.className = "t01-tok" + (k === 0 ? " t01-tok-first" : "");
        td.textContent = stop[0];
        slotD.appendChild(td);
        var tp = document.createElement("span");
        tp.id = "t01-tp-" + k;
        tp.className = "t01-tok" + (k === 0 ? " t01-tok-first" : "");
        tp.textContent = "0" + (k + 1) + " / 0" + N;
        slotP.appendChild(tp);
        var tick = document.createElement("i");
        tick.id = "t01-tick-" + k;
        tick.className = "t01-tick";
        tick.style.left = ((k + 0.5) * 962) / N + "px";
        ticks.appendChild(tick);
      });

      var ORANGE = "#b9472f";
      var PASSED = "rgba(194,213,210,0.6)";
      var SCROLL_EASE = "power3.inOut";
      var ease = gsap.parseEase(SCROLL_EASE);

      // Time at which a leg's scroll position reaches `target` (bisection on the same ease the tween uses).
      function timeAtScroll(start, dur, y0, y1, target) {
        var lo = 0;
        var hi = 1;
        for (var i = 0; i < 40; i++) {
          var mid = (lo + hi) / 2;
          if (y0 + (y1 - y0) * ease(mid) < target) lo = mid;
          else hi = mid;
        }
        return start + dur * hi;
      }

      var tl = gsap.timeline({ paused: true });

      // The page starts parked on the hero.
      tl.set("#t01-page", { y: -STOPS[0][1] }, 0);

      // Tick 0 is current from the first frame.
      tl.fromTo(
        "#t01-tick-0",
        { scaleY: 2.4, backgroundColor: ORANGE },
        { scaleY: 1.6, backgroundColor: ORANGE, duration: 0.4, ease: "power3.out" },
        0
      );

      var arrive = []; // arrive[k] = time the window parks on section k
      arrive[0] = at(HERO_HOLD_BEATS);
      var beats = HERO_HOLD_BEATS;
      for (var i = 0; i < N - 1; i++) {
        var start = at(beats);
        beats += LEG_BEATS[i];
        var end = at(beats);
        var dur = end - start;
        var y0 = STOPS[i][1];
        var y1 = STOPS[i + 1][1];
        tl.fromTo("#t01-page", { y: -y0 }, { y: -y1, duration: dur, ease: SCROLL_EASE }, start);
        arrive[i + 1] = end;

        // The label and the tick advance when the next heading has climbed to the upper middle of the window
        // (373 px below the window's top edge).
        var swap = timeAtScroll(start, dur, y0, y1, STOPS[i + 1][2] - 373);
        var k = i + 1;
        tl.set("#t01-td-" + i, { opacity: 0 }, swap);
        tl.set("#t01-tp-" + i, { opacity: 0 }, swap);
        tl.set("#t01-td-" + k, { opacity: 1 }, swap);
        tl.set("#t01-tp-" + k, { opacity: 1 }, swap);
        // (set + to, not fromTo: a fromTo would paint every future tick orange at authoring time.)
        tl.set("#t01-tick-" + i, { scaleY: 1, backgroundColor: PASSED }, swap);
        tl.set("#t01-tick-" + k, { scaleY: 2.4, backgroundColor: ORANGE }, swap);
        tl.to("#t01-tick-" + k, { scaleY: 1.6, duration: 0.4, ease: "power3.out" }, swap);
      }

      // ---- Plates: each slides up and settles on power3, holds through the slow part of its stop, then drops away.
      function plate(id, from, to) {
        tl.fromTo(id, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, from);
        tl.to(id, { opacity: 0, y: 24, duration: 0.3, ease: "power2.in" }, to);
      }
      plate("#t01-p-open", 0.5, at(HERO_HOLD_BEATS) - 0.1); // hero hold: "one scroll."
      plate("#t01-p-client", arrive[1] - 0.8, arrive[1] + 1.2); // Featured Projects: "real client work."
      plate("#t01-p-demos", arrive[2] - 0.8, arrive[2] + 1.2); // Try my projects: "20 interactive demos."
      // Closing: the address lands once the window has parked on the contact section, and stays to the end.
      tl.fromTo("#t01-p-url", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, arrive[N - 1] + 0.2);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
