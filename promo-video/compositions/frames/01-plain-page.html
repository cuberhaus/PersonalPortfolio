      </filter>
      <filter data-hf-id="hf-6zle" id="f01-mat-b" color-interpolation-filters="sRGB">

  <style>
    @font-face {
      font-family: "Inter";

    #root {
      width: 1080px;

    .f01-ground { position: absolute; inset: 0; background: #17231f; }
    .f01-stage { position: absolute; inset: 0; overflow: hidden; }
    .f01-plate { position: absolute; inset: 0; overflow: hidden; }

    /* Site screenshot (1080x1360 at scale 1): shifted up 70px so the site nav is cropped away; the band

    .f01-pic {

      left: 0;
      top: -70px;

    .f01-pic-B { background-image: url("assets/look-01-comic-light.png"); }

    /* Glitch layer: black backdrop + three single-channel layers screened back together. */
    .f01-glitch { position: absolute; inset: 0; background: #000; opacity: 0; isolation: isolate; }
    .f01-ch { position: absolute; inset: 0; mix-blend-mode: screen; }
    .f01-ch-r { filter: url(#f01-mat-r); }

    .f01-glitch-B .f01-bandpic { background-image: url("assets/look-01-comic-light.png"); }

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "01-plain-page";
      var BANDS = 6;
      var BAND_H = 180;

      // Build the glitch layers (3 channels x 6 bands) for each plate. Deterministic, no randomness.
      ["A", "B"].forEach(function (key) {
        var glitch = document.getElementById("f01-glitch-" + key);
        glitch.className = "f01-glitch f01-glitch-" + key;
        ["r", "g", "b"].forEach(function (chan) {
          var ch = document.createElement("div");
          ch.id = "f01-ch-" + key + chan;
          ch.className = "f01-ch f01-ch-" + chan;
          for (var i = 0; i < BANDS; i++) {
            var band = document.createElement("div");
            band.className = "f01-band";
            band.style.top = i * BAND_H + "px";
            var pic = document.createElement("div");
            pic.className = "f01-bandpic";
            pic.setAttribute("data-b", String(i));
            pic.style.top = -70 - i * BAND_H + "px";
            band.appendChild(pic);
            ch.appendChild(band);
          }
          glitch.appendChild(ch);
        });
      });

      // cut-the-curve: every band travels RIGHTWARD; accelerates into the cut, decelerates out of it.
      var SHIFT = [46, 112, 68, 148, 90, 58];
      var CHROMA = 20;
      var S = 1.1; // snap starts (outgoing accelerates)
      var CUT = 1.3; // hard cut at peak velocity
      var E = 1.5; // snap settles

      function pics(key) {
        return gsap.utils.toArray("#f01-glitch-" + key + " .f01-bandpic");
      }
      function bandX(sign) {
        return function (i, el) {
          return sign * SHIFT[parseInt(el.getAttribute("data-b"), 10)];
        };
      }

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0 - 1.1s): total stillness on the default look.

      // ---- Scene 2 (1.1 - 1.5s): the snap.
      // Outgoing: swap the clean base for the split channels, then accelerate rightward.
      tl.set("#f01-base-A", { opacity: 0 }, S);
      tl.set("#f01-glitch-A", { opacity: 1 }, S);
      tl.fromTo(pics("A"), { x: 0 }, { x: bandX(1), duration: CUT - S, ease: "power2.in" }, S);
      tl.fromTo("#f01-ch-Ar", { x: 0 }, { x: -CHROMA, duration: CUT - S, ease: "power2.in" }, S);
      tl.fromTo("#f01-ch-Ab", { x: 0 }, { x: CHROMA, duration: CUT - S, ease: "power2.in" }, S);

      // The cut: plate B replaces plate A at the same speed and direction.
      tl.set("#f01-plate-A", { opacity: 0 }, CUT);
      tl.set("#f01-plate-B", { opacity: 1 }, CUT);
      tl.set("#f01-base-B", { opacity: 0 }, CUT);
      tl.set("#f01-glitch-B", { opacity: 1 }, CUT);
      tl.fromTo(pics("B"), { x: bandX(-1) }, { x: 0, duration: E - CUT, ease: "power2.out" }, CUT);
      tl.fromTo("#f01-ch-Br", { x: -CHROMA }, { x: 0, duration: E - CUT, ease: "power2.out" }, CUT);
      tl.fromTo("#f01-ch-Bb", { x: CHROMA }, { x: 0, duration: E - CUT, ease: "power2.out" }, CUT);

      // Settle onto the clean comic image.
      tl.set("#f01-glitch-B", { opacity: 0 }, E);
      tl.set("#f01-base-B", { opacity: 1 }, E);

      // Dressing: scanlines ride the snap, a one-frame-ish flash lands on the cut.
      tl.fromTo("#f01-scan", { opacity: 0 }, { opacity: 0.55, duration: CUT - S, ease: "power2.in" }, S);
      tl.to("#f01-scan", { opacity: 0, duration: E - CUT, ease: "power2.out" }, CUT);
      tl.fromTo("#f01-flash", { opacity: 0 }, { opacity: 0.28, duration: 0.05, ease: "none" }, CUT - 0.05);
      tl.to("#f01-flash", { opacity: 0, duration: 0.1, ease: "none" }, CUT);

      // ---- Scene 3 (1.5 - 3.6s): the comic look holds. Ink plate slams in, then the label. No drift.
      tl.fromTo(
        "#f01-ink",
        { scale: 1.45, filter: "blur(14px)", opacity: 0, transformOrigin: "100% 0%" },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        2.1
      );
      tl.fromTo("#f01-label", { x: 48, opacity: 0 }, { x: 0, opacity: 0.85, duration: 0.45, ease: "expo.out" }, 2.9);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
