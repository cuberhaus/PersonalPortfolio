  <script>
    (function () {
      var FRAME_ID = "06-pick-your-look";
      var ADDRESS = "polcasacubertagil.com";

      // ---- Build per-character spans with a zero-width caret slot before the first and after every character.
      var type = document.getElementById("f06-type");
      function caretSlot(k) {
        var c = document.createElement("span");
        c.id = "f06-caret-" + k;
        c.className = "f06-caret";
        return c;
      }
      type.appendChild(caretSlot(0));
      for (var i = 0; i < ADDRESS.length; i++) {
        var ch = document.createElement("span");
        ch.id = "f06-c-" + i;
        ch.className = "f06-c";
        ch.textContent = ADDRESS.charAt(i);
        type.appendChild(ch);
        type.appendChild(caretSlot(i + 1));
      }

      // ---- Keystroke schedule (discrete states): a steady cluster, a short beat before the dot.
      var START = 1.05; // first key
      var KEY = 0.058; // seconds per key
      var DOT_AT = ADDRESS.indexOf(".");
      var times = [];
      for (var j = 0; j < ADDRESS.length; j++) {
        times.push(START + j * KEY + (j >= DOT_AT ? 0.12 : 0));
      }
      var DONE = times[times.length - 1] + KEY; // ~2.45

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0 - 1.0s): the invitation settles on power3.
      tl.fromTo("#f06-h1", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0);

      // Scene 2 (1.0 - 2.5s): the field and caret appear, then the address is typed one key at a time.
      tl.fromTo("#f06-box", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out" }, 0.7);
      tl.set("#f06-caret-0", { opacity: 1 }, 0.7);
      tl.set("#f06-caret-0", { opacity: 0 }, times[0]);
      for (var k = 0; k < ADDRESS.length; k++) {
        tl.set("#f06-c-" + k, { opacity: 1 }, times[k]);
        // the caret trails the newest character
        tl.set("#f06-caret-" + (k + 1), { opacity: 1 }, times[k]);
        if (k < ADDRESS.length - 1) {
          tl.set("#f06-caret-" + (k + 1), { opacity: 0 }, times[k + 1]);
        }
      }

      // Scene 3 (2.5 - 3.6s): the caret rests (one slow blink), the name appears under the address, then a still hold.
      var LAST = "#f06-caret-" + ADDRESS.length;
      tl.set(LAST, { opacity: 0 }, 2.85);
      tl.set(LAST, { opacity: 1 }, 3.1);
      tl.fromTo("#f06-namep", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
