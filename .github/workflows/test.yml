name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, type-check, audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Type-check (astro check)
        id: typecheck
        continue-on-error: true
        run: npm run check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Format check
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        run: npm run audit:ci

      - name: Quality gate
        if: ${{ always() && !cancelled() }}
        run: |
          if [[ "${{ steps.install.outcome }}" != "success" ||
                "${{ steps.typecheck.outcome }}" != "success" ||
                "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.audit.outcome }}" != "success" ]]; then
            echo "One or more quality checks failed."
            exit 1
          fi

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  planner-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: planner-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - portfolio-smoke
          - readme-gallery
          - browser-demos
          - themes
          - debug-overlay
          - keyboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium chromium-headless-shell
          fi

      - name: Build site
        run: npm run build

      - name: Validate committed demo gallery
        if: matrix.project == 'readme-gallery'
        run: npm run demo-gallery:check

      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }} --workers=${{ matrix.project == 'browser-demos' && 4 || 1 }}

      - name: Check committed demo gallery is current
        if: matrix.project == 'readme-gallery'
        run: git diff --exit-code -- docs/demo-gallery.md docs/assets/demo-gallery/

      - name: Upload demo gallery
        if: always() && matrix.project == 'readme-gallery'
        uses: actions/upload-artifact@v7
        with:
          name: demo-gallery
          path: |
            docs/demo-gallery.md
            docs/assets/demo-gallery/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  # a11y is sharded across 8 runners for speed. ~830 tests / 8 shards / 4
  # workers per shard = 32x effective parallelism. Workers per shard stays
  # at 4 because GitHub-hosted runners have 4 CPU cores; raising it makes
  # workers contend for CPU rather than going faster. Eight shards keep the
  # complete 19-job workflow under GitHub's 20-concurrent-job limit, so no
  # critical-path job waits for a runner slot. retries=0 is set per-project in
  # playwright.config.ts since axe results don't flake.
  playwright-a11y:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium chromium-headless-shell
          fi

      - name: Build site
        run: npm run build

      - name: Run E2E (a11y, shard ${{ matrix.shard }}/8)
        run: npx playwright test --project=a11y --workers=4 --shard=${{ matrix.shard }}/8

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-a11y-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Visual regression. Skipped until baselines exist under
  # e2e/visual.spec.ts-snapshots/ — generate them via the
  # "Visual baselines (manual)" workflow, download the artifact, and
  # commit the PNGs to enable this job.
  playwright-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for baselines
        id: baselines
        run: |
          if [ -d e2e/visual.spec.ts-snapshots ] && [ -n "$(ls -A e2e/visual.spec.ts-snapshots 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Visual baselines not committed yet — skipping. See .github/workflows/visual-baselines.yml."
          fi

      - name: Setup Node
        if: steps.baselines.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.baselines.outputs.exists == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.baselines.outputs.exists == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.baselines.outputs.exists == 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium chromium-headless-shell
          fi

      - name: Build site
        if: steps.baselines.outputs.exists == 'true'
        run: npm run build

      - name: Run visual-regression
        if: steps.baselines.outputs.exists == 'true'
        run: npx playwright test --project=visual

      - name: Upload Playwright report (with diffs)
        if: always() && steps.baselines.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lhci
